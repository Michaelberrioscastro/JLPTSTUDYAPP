name: nihongo_reader
description: "Nihongo Reader - lector y anotador de libros para estudio de japonés."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dart_pdf_editor: ^5.1.1
  docx_file_viewer: ^1.0.4
  file_picker: ^13.1.0
  flutter_epub_reader: ^1.3.4
  http: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf_document: ^5.1.1
  pdf_ocr_ondevice: ^5.1.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dependency_overrides:
  flutter_inappwebview: 6.2.0-beta.3
  flutter_inappwebview_android: 1.2.0-beta.3
  flutter_inappwebview_ios: 1.2.0-beta.3
  flutter_inappwebview_macos: 1.2.0-beta.3
  flutter_inappwebview_web: 1.2.0-beta.3
  flutter_inappwebview_windows: 0.7.0-beta.3
  flutter_inappwebview_platform_interface: 1.4.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
